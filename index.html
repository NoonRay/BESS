<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell to Boardroom — NoonRay Energy</title>
<meta name="description" content="Interactive full-screen console for Session 18 practical demo.">
<style>
  /* ---------------- Reset & Fonts ---------------- */
  html, body { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; }
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  /* ---------------- Color Variables ---------------- */
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --ink: #0f172a;
    --ink-secondary: #475569;
    --ink-muted: #64748b;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --navy: #1e3a8a;
    --navy-2: #172554;
    --navy-3: #0b1120;
    --navy-tint: #eff6ff;
    --orange: #ea580c;
    --orange-ink: #9a3412;
    --orange-tint: #ffedd5;
    --green: #16a34a;
    --good: #22c55e;
    --good-tint: #dcfce7;
    --warning-fill: #f59e0b;
    --warning-ink: #92400e;
    --warning-tint: #fef3c7;
    --critical: #ef4444;
    --critical-tint: #fee2e2;
    --ai-purple: #8b5cf6;
    --ai-purple-tint: #ede9fe;
    --chart-axis: #94a3b8;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 8px 20px -4px rgba(0,0,0,0.08);
    color-scheme: light;
  }
  
  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #151e2e;
    --surface-2: #1e293b;
    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --ink-muted: #94a3b8;
    --border: #334155;
    --border-strong: #475569;
    --navy: #60a5fa;
    --navy-tint: #1e3a8a;
    --orange: #f97316;
    --orange-ink: #fdba74;
    --orange-tint: #7c2d12;
    --green: #4ade80;
    --good: #22c55e;
    --good-tint: #064e3b;
    --warning-fill: #fbbf24;
    --warning-ink: #fde68a;
    --warning-tint: #78350f;
    --critical: #f87171;
    --critical-tint: #7f1d1d;
    --ai-purple: #a78bfa;
    --ai-purple-tint: #4c1d95;
    --chart-axis: #475569;
    color-scheme: dark;
  }

  body {
    background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex; flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { font-family: 'Source Serif 4', serif; margin: 0; }

  /* ---------------- App Header ---------------- */
  .appbar {
    height: 64px; background: linear-gradient(135deg, var(--navy-3), var(--navy-2));
    color: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10;
  }
  .brand-zone { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 32px; height: 32px; background: var(--orange); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .brand-logo svg { width: 18px; height: 18px; }
  .brand-text h1 { font-size: 17px; font-weight: 700; line-height: 1.1; }
  .brand-text h1 span { color: #a3e635; }
  .brand-text .sub { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #cbd5e1; font-weight: 600; }

  .live-clock { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono'; font-size: 13px; color: #cbd5e1; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
  .live-indicator { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

  .appbar-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .icon-btn:hover { background: rgba(255,255,255,0.2); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------------- Main Layout ---------------- */
  .prog-bar { height: 4px; background: var(--border); width: 100%; flex-shrink: 0; }
  .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--orange), var(--green)); transition: width 0.4s ease; }

  .main-wrapper { display: flex; flex: 1; overflow: hidden; }
  
  .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 5; }
  .sidebar-tabs { display: flex; padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 6px; }
  .tab { flex: 1; padding: 10px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink-muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: left; }
  .tab.active { background: var(--navy-tint); color: var(--navy); border-color: var(--border); }
  .tab span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  
  .sidebar-steps { flex: 1; overflow-y: auto; padding: 16px; }
  .step-item { display: flex; gap: 12px; padding: 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; margin-bottom: 4px; }
  .step-item:hover { background: var(--surface-2); }
  .step-item.current { background: var(--navy-tint); border-color: var(--border); box-shadow: var(--shadow-sm); transform: translateX(2px); }
  .step-num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: var(--ink-muted); }
  .step-item.current .step-num { background: var(--orange); border-color: var(--orange); color: #fff; }
  .step-item.done .step-num { background: var(--navy); border-color: var(--navy); color: #fff; }
  .step-text b { display: block; font-size: 13.5px; color: var(--ink); margin-bottom: 2px; }
  .step-text span { display: block; font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

  .stage-area { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; align-items: center; }
  .stage-card { width: 100%; max-width: 1100px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 550px; animation: fadeUp 0.3s ease-out; }
  
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .stage-head { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: flex-start; }
  .stage-badge { width: 44px; height: 44px; border-radius: 10px; background: var(--navy-tint); color: var(--navy); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stage-badge svg { width: 22px; height: 22px; }
  .stage-badge.ai-badge { background: var(--ai-purple-tint); color: var(--ai-purple); }
  .stage-title .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 4px; display: block; }
  .stage-title h2 { font-size: 24px; color: var(--ink); margin-bottom: 6px; }
  .stage-title p { margin: 0; font-size: 14px; color: var(--ink-secondary); line-height: 1.5; }

  .stage-body { padding: 28px 32px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
  
  .stage-foot { padding: 16px 32px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 16px 16px; display: flex; justify-content: space-between; align-items: center; }
  
  /* ---------------- Resized & Corrected UI Components ---------------- */
  .btn { appearance: none; border: none; font-family: inherit; font-weight: 600; font-size: 13.5px; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: filter 0.2s; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:not(:disabled):hover { filter: brightness(1.08); }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-navy { background: var(--navy); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-purple { background: var(--ai-purple); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--ink); }
  .btn svg { width: 14px; height: 14px; }

  .panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
  .panel-navy { background: var(--navy); color: #fff; border: none; }
  
  .grid-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
  .field label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-secondary); }
  .field input, .field select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); font-size: 14px; font-family: inherit; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--orange); }
  
  /* Sizing Fix: Status Banners */
  .status-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; animation: fadeUp 0.2s ease-out; }
  .status-banner.good { background: var(--good-tint); color: var(--good); border: 1px solid rgba(34, 197, 94, 0.2); }
  .status-banner.warn { background: var(--warning-tint); color: var(--warning-ink); border: 1px solid rgba(245, 158, 11, 0.2); }
  .status-banner.bad { background: var(--critical-tint); color: var(--critical); border: 1px solid rgba(239, 68, 68, 0.2); }
  
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .chip-good { background: var(--good-tint); color: var(--good); }
  .chip-critical { background: var(--critical-tint); color: var(--critical); }
  .chip-draft { background: var(--border); color: var(--ink-secondary); }
  
  table.data-table { width: 100%; border-collapse: collapse; text-align: left; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .data-table th { background: var(--surface-2); padding: 10px 14px; font-size: 11.5px; text-transform: uppercase; color: var(--ink-secondary); border-bottom: 1px solid var(--border); }
  .data-table td { padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); font-family: 'IBM Plex Mono'; }
  .data-table tr:last-child td { border-bottom: none; }
  
  /* Timeline */
  .timeline { list-style: none; padding: 0; margin: 0; }
  .tl-item { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--border-strong); }
  .tl-item:last-child::before { display: none; }
  .tl-dot { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--navy-tint); color: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 2; border: 2px solid var(--surface); }
  .tl-body b { display: block; font-size: 14px; margin-bottom: 2px; }
  .tl-body span { display: block; font-size: 12.5px; color: var(--ink-muted); margin-bottom: 2px; }
  
  /* Sizing Fix: Talkpoints */
  .talkpoint { background: transparent; border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px 16px; margin-top: auto; }
  .talkpoint summary { cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 8px; list-style: none; }
  .talkpoint summary::-webkit-details-marker { display: none; }
  .talkpoint p { padding: 8px 0 0 0; margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-secondary); border-top: 1px dashed var(--border); margin-top: 10px; }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; height: 4px; accent-color: var(--orange); }
  .slider-val { font-family: 'IBM Plex Mono'; font-size: 14px; font-weight: 600; min-width: 50px; text-align: right; }

  /* AI/ML Specific Elements */
  .ai-vision-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); position: relative; }
  .ai-vision-img { height: 100px; background: var(--surface-2); position: relative; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--ink-muted); font-family: monospace; border-bottom: 1px solid var(--border); }
  .ai-bbox { position: absolute; border: 2px solid var(--critical); background: rgba(239, 68, 68, 0.1); width: 40px; height: 40px; top: 30px; left: 50px; display: none; }
  .ai-vision-card.critical .ai-bbox { display: block; }
  .ai-meta { padding: 10px; }
  .ai-meta .score { font-family: 'IBM Plex Mono'; font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .ai-meta .desc { font-size: 11px; color: var(--ink-secondary); font-weight: 600; text-transform: uppercase; }

  .chart-container { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); position: relative; overflow:hidden;}
</style>
</head>
<body>

<!-- Header -->
<header class="appbar">
  <div class="brand-zone">
    <div class="brand-logo" id="headerLogo"></div>
    <div class="brand-text">
      <h1>NoonRay<span> Energy</span></h1>
      <div class="sub">MES &amp; Analytics Console</div>
    </div>
  </div>
  
  <div class="live-clock">
    <div class="live-indicator"></div>
    <span id="clockTime">--:--:--</span>
  </div>

  <div class="appbar-actions">
    <button class="icon-btn" data-action="toggleTheme" title="Toggle Theme" id="btnTheme"></button>
    <button class="btn btn-ghost" data-action="resetDemo" style="border-color: rgba(255,255,255,0.2); color: #fff; font-size: 12px; padding: 6px 12px;">Reset</button>
  </div>
</header>
<div class="prog-bar"><div class="prog-fill" id="mainProgress"></div></div>

<!-- Layout -->
<main class="main-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-tabs" id="tabNav"></div>
    <div class="sidebar-steps" id="stepNav"></div>
  </aside>

  <!-- Stage -->
  <section class="stage-area">
    <div class="stage-card">
      <div class="stage-head" id="stageHead"></div>
      <div class="stage-body" id="stageBody"></div>
      <div class="stage-foot">
        <span class="foot-progress" id="footProgress" style="font-size: 12px; color: var(--ink-muted);"></span>
        <div style="display:flex; gap: 8px;">
          <button class="btn btn-ghost" data-action="prevStep" id="btnPrev">Back</button>
          <button class="btn btn-primary" data-action="nextStep" id="btnNext">Next Step &rarr;</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  "use strict";

  // --- Clock ---
  setInterval(() => {
    document.getElementById('clockTime').textContent = new Date().toLocaleTimeString('en-US', {hour12: false});
  }, 1000);

  // --- Icons ---
  const ICONS = {
    lightning: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M17 6l2.5 2.5M14 9l2 2"/>',
    doc: '<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 12h6M9 16h6M9 8h3"/>',
    box: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
    tree: '<circle cx="6" cy="5" r="2.4"/><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 7.4V19M6 12h6.6L18 9.6M6 12h6.6L18 14.4"/>',
    bell: '<path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.3"/>',
    pulse: '<path d="M3 12h4l2 7 4-14 2 7h6"/>',
    calc: '<rect x="4" y="2.5" width="16" height="19" rx="2.2"/><path d="M7.5 6.5h9M7.5 11h2M7.5 15h2M7.5 19h2M12 11h2M12 15h2M12 19h2M16.5 11h0M16.5 15v4"/>',
    layers: '<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5M3 18l9 5 9-5"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    warn: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>',
    cpu: '<rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
    moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>'
  };
  function getIcon(name) { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

  $('headerLogo').innerHTML = getIcon('lightning');

  // --- Data & State ---
  const DEMO = {
    part: 1, idx: {1:0, 2:0}, theme: 'system',
    login: { done: false, user: 'OP-2247', station: 'Formation Cycler #4', err: '', time: null },
    wo: { done: false, showBom: false, time: null },
    batch: { id: 'B-'+Math.floor(10000+Math.random()*90000), done: false, data: [] },
    tree: { done: false, id: null, dir: 'backward' },
    andon: { active: false, done: false, type: 'quality', start: null, resp: null, esc: null, end: null, log: [], timer: null },
    qual: { th: 80, items: [] },
    maint: { sens: 4.0, mac: 'form4' },
    soc: { init: 62, cur: -15, time: 0.25, cap: 75 },
    twin: { crate: 1.0 }
  };

  const STATIONS = ['Formation Cycler #4', 'Calendering Line 2', 'Winding Cell 6'];
  const BOM_ITEMS = [
    { item:'Electrode foil (Al/Cu)', qty:'4,000 sheets', onHand:'12,400' },
    { item:'Separator film', qty:'4,000 m', onHand:'18,200 m' },
    { item:'Electrolyte', qty:'620 L', onHand:'1,050 L' }
  ];
  const ANDON_TYPES = {
    quality: { label:'Quality', example:'Vision system flags a defect', targetMin:5 },
    machine: { label:'Machine fault', example:'PLC over-temperature trip', targetMin:10 }
  };
  const TALK = {
    login: "MES's first job is proving readiness before releasing work. What happens if the equipment check fails?",
    wo: "The work order is where ERP's plan hands off to MES execution. What goes wrong if operators use printed paper?",
    batch: "Every reading becomes part of the permanent cell genealogy. Which of these readings is most critical?",
    tree: "This is the exact record a recall pulls. How fast could you do this backward trace with paper logs?",
    andon: "The MTTR clock starts instantly. What would a rising MTTR trend over a week tell the plant manager?",
    qual: "Notice how the Computer Vision model provides a confidence score and a bounding box, not just a binary pass/fail. Why is this explicit classification crucial for continuous model retraining?",
    maint: "The solid line is historical sensor data; the dashed line is the Machine Learning forecast. How does forecasting an anomaly *before* it crosses the threshold change maintenance scheduling?",
    soc: "Physics-based Coulomb counting (top) assumes a perfect battery. The Neural Network (bottom) accounts for non-linear capacity fade (hidden internal resistance). Over years, which one protects the warranty?",
    twin: "We are running a Neural Network Degradation Simulator. We can test abusive C-rates in software to find the breaking point without destroying a physical BESS asset."
  };

  const STEPS = {
    1: [
      { id: 'login', icon: 'key', title: 'Station Login', desc: 'Authenticate operator and validate equipment readiness.' },
      { id: 'wo', icon: 'doc', title: 'Work Order', desc: 'Release WO-88214 and lock in routing/BOM.' },
      { id: 'batch', icon: 'box', title: 'Batch Tracking', desc: 'Log real-time process readings against the batch.' },
      { id: 'tree', icon: 'tree', title: 'Genealogy Trace', desc: 'Execute a backward/forward traceability lookup.' },
      { id: 'andon', icon: 'bell', title: 'Andon Escalation', desc: 'Trigger an alert and track the live MTTR response.' }
    ],
    2: [
      { id: 'qual', icon: 'grid', ai: true, title: 'AI Predictive Quality', desc: 'Computer Vision defect detection and confidence scoring.' },
      { id: 'maint', icon: 'pulse', ai: true, title: 'AI Predictive Maintenance', desc: 'Time-series forecasting for vibration drift and RUL.' },
      { id: 'soc', icon: 'calc', ai: true, title: 'Neural Net SOC Estimator', desc: 'Coulomb counting vs. AI-corrected degradation modeling.' },

  function getTalk(key) {
    return `<details class="talkpoint"><summary>${getIcon('info')} Instructor Talking Point</summary><p>${TALK[key]}</p></details>`;
  }

  // --- Core Render Loop ---
  function render() {
    renderSidebar();
    renderStage();
    updateProgress();
  }

  function renderSidebar() {
    $('tabNav').innerHTML = `
      <button class="tab ${DEMO.part===1?'active':''}" data-action="setPart" data-part="1"><span>Part 1</span>MES Base</button>
      <button class="tab ${DEMO.part===2?'active':''}" data-action="setPart" data-part="2"><span>Part 2</span>AI Models</button>
    `;
    const list = STEPS[DEMO.part];
    const curIdx = DEMO.idx[DEMO.part];
    $('stepNav').innerHTML = list.map((s, i) => {
      let isDone = DEMO[s.id] && DEMO[s.id].done;
      if (s.id==='andon' && DEMO.andon.log.length>0) isDone = true;
      if (s.ai) isDone = true; // Auto done for analytics
      
      const stateClass = i === curIdx ? 'current' : (isDone ? 'done' : '');
      const numIcon = isDone && i !== curIdx ? getIcon('check') : (i+1);
      return `
        <div class="step-item ${stateClass}" data-action="setStep" data-step="${i}">
          <div class="step-num">${numIcon}</div>
          <div class="step-text"><b>${s.title}</b><span>${s.desc}</span></div>
        </div>`;
    }).join('');
  }

  function renderStage() {
    const list = STEPS[DEMO.part];
    const i = DEMO.idx[DEMO.part];
    const s = list[i];
    
    // Header
    const badgeClass = s.ai ? 'stage-badge ai-badge' : 'stage-badge';
    $('stageHead').innerHTML = `
      <div class="${badgeClass}">${getIcon(s.icon)}</div>
      <div class="stage-title">
        <span class="eyebrow" style="color: ${s.ai ? 'var(--ai-purple)' : 'var(--orange)'}">Module ${DEMO.part===1?'A/B':'C/D'} &middot; Step ${i+1}</span>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
      </div>
    `;
    
    // Body dispatch
    const body = $('stageBody');
    if(s.id === 'login') drawLogin(body);
    if(s.id === 'wo') drawWO(body);
    if(s.id === 'batch') drawBatch(body);
    if(s.id === 'tree') drawTree(body);
    if(s.id === 'andon') drawAndon(body);
    if(s.id === 'qual') drawQual(body);
    if(s.id === 'maint') drawMaint(body);
    if(s.id === 'soc') drawSoc(body);
    if(s.id === 'twin') drawTwin(body);

    // Footer
    $('btnPrev').disabled = (i === 0 && DEMO.part === 1);
    $('btnNext').textContent = (i === list.length-1) ? (DEMO.part===1 ? 'Go to AI Models \u2192' : 'Restart Demo') : 'Next Step \u2192';
  }

  function updateProgress() {
    let total = STEPS[1].length + STEPS[2].length;
    let done = 0;
    if(DEMO.login.done) done++;
    if(DEMO.wo.done) done++;
    if(DEMO.batch.done) done++;
    if(DEMO.tree.done) done++;
    if(DEMO.andon.log.length>0) done++;
    done += 4; // Analytics
    $('mainProgress').style.width = (done/total*100) + '%';
  }

    DEMO.andon.end = new Date(); DEMO.andon.done = true; clearInterval(DEMO.andon.timer);

    DEMO.andon.log.unshift({ type: t.label, start: DEMO.andon.start, mttr: mttr, pass: (mttr <= t.targetMin*60000) });
    render();
  }

  function calcRUL(data, threshold) {
    let slope = (data[data.length-1] - data[data.length-3]) / 2;
    if(slope <= 0 || data[data.length-1] >= threshold) return "0";
    let remaining = (threshold - data[data.length-1]) / slope;
    return "+" + Math.floor(remaining * 1000).toLocaleString();
  }

  // --- Advanced SVG Chart Renderer (AI Forecast visual) ---
  function drawAiForecastChart(id, data, threshold, isDegradation = false) {
    const el = $(id);
    if(!el) return;
    const w = el.clientWidth - 40, h = el.clientHeight - 40;
    
    // For maintenance, we forecast *from* the last historical point. For Twin, the whole thing is a forecast.
    let historical = isDegradation ? [100] : data;
    let forecast = [];
    
    if(!isDegradation) {
      let slope = (data[data.length-1] - data[data.length-3]) / 2;
      let lastVal = data[data.length-1];
      forecast.push(lastVal);
      for(let i=1; i<=4; i++) { forecast.push(lastVal + (slope * i)); }
    } else {
      forecast = data; 
      historical = [data[0]]; 
    }

    const fullData = [...historical.slice(0,-1), ...forecast];
    const maxVal = isDegradation ? 100 : Math.max(...fullData, threshold) * 1.2;
    const minVal = isDegradation ? 50 : 0;
    
    const getX = (i) => (i / Math.max(1, fullData.length-1)) * w;
    const getY = (val) => h - ((val - minVal) / (maxVal - minVal)) * h;

    let histPts = historical.map((v, i) => `${getX(i)},${getY(v)}`).join(' L ');
    let offset = historical.length - 1;
    let forePts = forecast.map((v, i) => `${getX(i + offset)},${getY(v)}`).join(' L ');
    
    // Confidence Interval Polygon
    let confPoly = '';
    if(forecast.length > 1) {
      let upper = forecast.map((v, i) => `${getX(i + offset)},${getY(v + (isDegradation?4:-0.4)*(i/forecast.length))}`);
      let lower = forecast.map((v, i) => `${getX(i + offset)},${getY(v - (isDegradation?4:-0.4)*(i/forecast.length))}`).reverse();
      confPoly = `M ${upper.join(' L ')} L ${lower.join(' L ')} Z`;
    }

    let thY = getY(threshold);
    
    el.innerHTML = `
      <svg width="100%" height="100%" style="overflow:visible;">
        <g transform="translate(20, 20)">
          <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--chart-axis)" stroke-width="2"/>
          <line x1="0" y1="0" x2="0" y2="${h}" stroke="var(--chart-axis)" stroke-width="2"/>
          
          <line x1="0" y1="${thY}" x2="${w}" y2="${thY}" stroke="var(--critical)" stroke-width="2" stroke-dasharray="4,4"/>
          <text x="${w+10}" y="${thY+5}" fill="var(--critical)" font-size="12" font-weight="600" font-family="IBM Plex Mono">${parseFloat(threshold).toFixed(1)}</text>
          
          <!-- Confidence Interval -->
          ${confPoly ? `<path d="${confPoly}" fill="var(--ai-purple)" opacity="0.15" />` : ''}
          
          <!-- Forecast Line -->
          ${forePts ? `<path d="M ${forePts}" fill="none" stroke="var(--ai-purple)" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>` : ''}
          
          <!-- Historical Line -->
          ${histPts && historical.length > 1 ? `<path d="M ${histPts}" fill="none" stroke="var(--series-1)" stroke-width="3" stroke-linecap="round"/>` : ''}
          
          <!-- Data Dots -->
          ${historical.map((v, i) => `<circle cx="${getX(i)}" cy="${getY(v)}" r="4" fill="var(--surface)" stroke="var(--series-1)" stroke-width="2"/>`).join('')}
          ${forecast.slice(1).map((v, i) => `<circle cx="${getX(i+offset+1)}" cy="${getY(v)}" r="4" fill="var(--surface)" stroke="var(--ai-purple)" stroke-width="2"/>`).join('')}
        </g>
      </svg>
    `;
  }

  // --- Theme Handlers ---
  function applyTheme() {
    const root = document.documentElement;
    if(DEMO.theme === 'light') root.setAttribute('data-theme', 'light');
    else if(DEMO.theme === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    
    let ico = DEMO.theme === 'light' ? 'sun' : (DEMO.theme === 'dark' ? 'moon' : 'monitor');
    $('btnTheme').innerHTML = getIcon(ico);
    try { localStorage.setItem('ctb-theme', DEMO.theme); } catch(e){}
  }

  // --- Global Event Delegation ---
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    
    const action = target.dataset.action;
    
    if (action === 'setPart') { DEMO.part = parseInt(target.dataset.part); render(); }
    else if (action === 'setStep') { DEMO.idx[DEMO.part] = parseInt(target.dataset.step); render(); }
    else if (action === 'prevStep') {
      let i = DEMO.idx[DEMO.part];
      if(i > 0) { DEMO.idx[DEMO.part]--; render(); }
      else if(DEMO.part === 2) { DEMO.part = 1; DEMO.idx[1] = STEPS[1].length-1; render(); }
    }
    else if (action === 'nextStep') {
      let i = DEMO.idx[DEMO.part], len = STEPS[DEMO.part].length;
      if(i < len-1) { DEMO.idx[DEMO.part]++; render(); }
      else if(DEMO.part === 1) { DEMO.part = 2; DEMO.idx[2] = 0; render(); }
      else { $('btnReset').click(); }
    }
    else if (action === 'toggleTheme') { DEMO.theme = DEMO.theme === 'system' ? 'light' : (DEMO.theme === 'light' ? 'dark' : 'system'); applyTheme(); render(); }
    else if (action === 'openHelp') $('helpModal').hidden = false;
    else if (action === 'closeHelp') $('helpModal').hidden = true;
    else if (action === 'resetDemo') {
      Object.assign(DEMO, {
        part: 1, idx: {1:0, 2:0},
        login: { done: false, user: 'OP-2247', station: 'Formation Cycler #4', err: '', time: null },
        wo: { done: false, showBom: false, time: null },
        batch: { id: 'B-'+Math.floor(10000+Math.random()*90000), done: false, data: [] },
        tree: { done: false, id: null, dir: 'backward' },
        andon: { active: false, done: false, type: 'quality', start: null, resp: null, esc: null, end: null, log: [], timer: null },
        qual: { th: 80, items: [] }, maint: { sens: 4.0, mac: 'form4' },
        soc: { init: 62, cur: -15, time: 0.25, cap: 75 }, twin: { crate: 1.0 }
      });
      render();
    }
    
    // View Actions
    else if (action === 'testLogin') { DEMO.login.user = target.dataset.u; DEMO.login.station = target.dataset.s; DEMO.login.err=''; render(); }
    else if (action === 'doLogin') { doLogin(); }
    else if (action === 'toggleBOM') { DEMO.wo.showBom = !DEMO.wo.showBom; render(); }
    else if (action === 'releaseWO') { DEMO.wo.done = true; DEMO.wo.time = new Date().toLocaleTimeString(); render(); }
    else if (action === 'addManualReading') { doAddReading(false); }
    else if (action === 'addRandReading') { doAddReading(true); }
    else if (action === 'flagAndonBatch') { 
      DEMO.andon.type = 'quality'; DEMO.part = 1; DEMO.idx[1] = 4;
      doTriggerAndon();
    }
    else if (action === 'execTrace') { DEMO.tree.done = true; render(); }
    else if (action === 'setTreeDir') { DEMO.tree.dir = target.dataset.dir; render(); }
    else if (action === 'setAndonType') { DEMO.andon.type = target.dataset.type; render(); }
    else if (action === 'triggerAndon') { doTriggerAndon(); }
    else if (action === 'ackAndon') { DEMO.andon.resp = new Date(); render(); }
    else if (action === 'resolveAndon') { doResolveAndon(); }
    else if (action === 'newAndon') { DEMO.andon.active = false; DEMO.andon.done = false; render(); }
    else if (action === 'resampleQual') { generateQualData(); render(); }
    else if (action === 'setSocArgs') { DEMO.soc.init = parseFloat(target.dataset.i); DEMO.soc.cur = parseFloat(target.dataset.c); DEMO.soc.time = parseFloat(target.dataset.t); render(); }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'lOp') DEMO.login.user = el.value;
    else if (el.id === 'lSt') DEMO.login.station = el.value;
    else if (el.id === 'threshSlider') { DEMO.qual.th = el.value; render(); }
    else if (el.id === 'sensSlider') { DEMO.maint.sens = el.value; render(); }
    else if (el.id === 'socInit') { DEMO.soc.init = parseFloat(el.value); render(); }
    else if (el.id === 'socCur') { DEMO.soc.cur = parseFloat(el.value); render(); }
    else if (el.id === 'socTime') { DEMO.soc.time = parseFloat(el.value); render(); }
    else if (el.id === 'crateSlider') { DEMO.twin.crate = el.value; render(); }
  });

  document.addEventListener('keydown', e => {
    if(['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if(e.key === 'Escape') $('helpModal').hidden = true;
    if(e.key === 'ArrowRight') $('btnNext').click();
    if(e.key === 'ArrowLeft') $('btnPrev').click();
  });

  // Init
  applyTheme();
  render();

});
</script>
