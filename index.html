<script>
(function initApp() {
  "use strict";

  // --- 1. Clock Fix (Runs immediately, then every second) ---
  function updateClock() {
    const clockEl = document.getElementById('clockTime');
    if (clockEl) {
      clockEl.textContent = new Date().toLocaleTimeString('en-US', {hour12: false});
    }
  }
  updateClock(); // Initial call so it doesn't show --:--:--
  setInterval(updateClock, 1000);

  // --- 2. Icons ---
  const ICONS = {
    lightning: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M17 6l2.5 2.5M14 9l2 2"/>',
    doc: '<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 12h6M9 16h6M9 8h3"/>',
    box: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
    tree: '<circle cx="6" cy="5" r="2.4"/><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 7.4V19M6 12h6.6L18 9.6M6 12h6.6L18 14.4"/>',
    bell: '<path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.3"/>',
    pulse: '<path d="M3 12h4l2 7 4-14 2 7h6"/>',
    calc: '<rect x="4" y="2.5" width="16" height="19" rx="2.2"/><path d="M7.5 6.5h9M7.5 11h2M7.5 15h2M7.5 19h2M12 11h2M12 15h2M12 19h2M16.5 11h0M16.5 15v4"/>',
    layers: '<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5M3 18l9 5 9-5"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    warn: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>',
    cpu: '<rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
    moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
    fullscreen: '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
    refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>'
  };
  function getIcon(name) { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

  // --- 3. Data & State ---
  const DEMO = {
    part: 1, idx: {1:0, 2:0}, theme: 'system',
    login: { done: false, user: 'OP-2247', station: 'Formation Cycler #4', err: '', time: null },
    wo: { done: false, showBom: false, time: null },
    batch: { id: 'B-'+Math.floor(10000+Math.random()*90000), done: false, data: [] },
    tree: { done: false, id: null, dir: 'backward' },
    andon: { active: false, done: false, type: 'quality', start: null, resp: null, esc: null, end: null, log: [], timer: null },
    qual: { th: 80, items: [] },
    maint: { sens: 4.0, mac: 'form4' },
    soc: { init: 62, cur: -15, time: 0.25, cap: 75 },
    twin: { crate: 1.0 }
  };

  const STATIONS = ['Formation Cycler #4', 'Calendering Line 2', 'Winding Cell 6'];
  const BOM_ITEMS = [
    { item:'Electrode foil (Al/Cu)', qty:'4,000 sheets', onHand:'12,400' },
    { item:'Separator film', qty:'4,000 m', onHand:'18,200 m' },
    { item:'Electrolyte', qty:'620 L', onHand:'1,050 L' }
  ];
  const ANDON_TYPES = {
    quality: { label:'Quality', example:'Vision system flags a defect', targetMin:5 },
    machine: { label:'Machine fault', example:'PLC over-temperature trip', targetMin:10 }
  };
  const TALK = {
    login: "MES's first job is proving readiness before releasing work. What happens if the equipment check fails?",
    wo: "The work order is where ERP's plan hands off to MES execution. What goes wrong if operators use printed paper?",
    batch: "Every reading becomes part of the permanent cell genealogy. Which of these readings is most critical?",
    tree: "This is the exact record a recall pulls. How fast could you do this backward trace with paper logs?",
    andon: "The MTTR clock starts instantly. What would a rising MTTR trend over a week tell the plant manager?",
    qual: "Notice how the Computer Vision model provides a confidence score and a bounding box, not just a binary pass/fail. Why is this explicit classification crucial for continuous model retraining?",
    maint: "The solid line is historical sensor data; the dashed line is the Machine Learning forecast. How does forecasting an anomaly *before* it crosses the threshold change maintenance scheduling?",
    soc: "Physics-based Coulomb counting (top) assumes a perfect battery. The Neural Network (bottom) accounts for non-linear capacity fade (hidden internal resistance). Over years, which one protects the warranty?",
    twin: "We are running a Neural Network Degradation Simulator. We can test abusive C-rates in software to find the breaking point without destroying a physical BESS asset."
  };

  const STEPS = {
    1: [
      { id: 'login', icon: 'key', title: 'Station Login', desc: 'Authenticate operator and validate equipment readiness.' },
      { id: 'wo', icon: 'doc', title: 'Work Order', desc: 'Release WO-88214 and lock in routing/BOM.' },
      { id: 'batch', icon: 'box', title: 'Batch Tracking', desc: 'Log real-time process readings against the batch.' },
      { id: 'tree', icon: 'tree', title: 'Genealogy Trace', desc: 'Execute a backward/forward traceability lookup.' },
      { id: 'andon', icon: 'bell', title: 'Andon Escalation', desc: 'Trigger an alert and track the live MTTR response.' }
    ],
    2: [
      { id: 'qual', icon: 'grid', ai: true, title: 'AI Predictive Quality', desc: 'Computer Vision defect detection and confidence scoring.' },
      { id: 'maint', icon: 'pulse', ai: true, title: 'AI Predictive Maintenance', desc: 'Time-series forecasting for vibration drift and RUL.' },
      { id: 'soc', icon: 'calc', ai: true, title: 'Neural Net SOC Estimator', desc: 'Coulomb counting vs. AI-corrected degradation modeling.' },
      { id: 'twin', icon: 'cpu', ai: true, title: 'Digital Twin Simulator', desc: 'Simulate asset degradation under variable C-rates.' }
    ]
  };

  function $(id) { return document.getElementById(id); }
  function getTalk(key) {
    return `<details class="talkpoint"><summary>${getIcon('info')} Instructor Talking Point</summary><p>${TALK[key]}</p></details>`;
  }

  function clearAllIntervals() {
    if(DEMO.andon.timer) { clearInterval(DEMO.andon.timer); DEMO.andon.timer = null; }
  }

  // --- 4. Core Render Loop ---
  function render() {
    renderSidebar();
    renderStage();
    updateProgress();
  }

  function renderSidebar() {
    $('tabNav').innerHTML = `
      <button class="tab ${DEMO.part===1?'active':''}" data-action="setPart" data-part="1"><span>Part 1</span>MES Base</button>
      <button class="tab ${DEMO.part===2?'active':''}" data-action="setPart" data-part="2"><span>Part 2</span>AI Models</button>
    `;
    const list = STEPS[DEMO.part];
    const curIdx = DEMO.idx[DEMO.part];
    $('stepNav').innerHTML = list.map((s, i) => {
      let isDone = DEMO[s.id] && DEMO[s.id].done;
      if (s.id==='andon' && DEMO.andon.log.length>0) isDone = true;
      if (s.ai) isDone = true; 
      
      const stateClass = i === curIdx ? 'current' : (isDone ? 'done' : '');
      const numIcon = isDone && i !== curIdx ? getIcon('check') : (i+1);
      return `
        <div class="step-item ${stateClass}" data-action="setStep" data-step="${i}">
          <div class="step-num">${numIcon}</div>
          <div class="step-text"><b>${s.title}</b><span>${s.desc}</span></div>
        </div>`;
    }).join('');
  }

  function renderStage() {
    clearAllIntervals();
    const list = STEPS[DEMO.part];
    const i = DEMO.idx[DEMO.part];
    const s = list[i];
    
    const badgeClass = s.ai ? 'stage-badge ai-badge' : 'stage-badge';
    $('stageHead').innerHTML = `
      <div class="${badgeClass}">${getIcon(s.icon)}</div>
      <div class="stage-title">
        <span class="eyebrow" style="color: ${s.ai ? 'var(--ai-purple)' : 'var(--orange)'}">Module ${DEMO.part===1?'A/B':'C/D'} &middot; Step ${i+1}</span>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
      </div>
    `;
    
    const body = $('stageBody');
    if(s.id === 'login') drawLogin(body);
    if(s.id === 'wo') drawWO(body);
    if(s.id === 'batch') drawBatch(body);
    if(s.id === 'tree') drawTree(body);
    if(s.id === 'andon') drawAndon(body);
    if(s.id === 'qual') drawQual(body);
    if(s.id === 'maint') drawMaint(body);
    if(s.id === 'soc') drawSoc(body);
    if(s.id === 'twin') drawTwin(body);

    $('btnPrev').disabled = (i === 0 && DEMO.part === 1);
    $('btnNext').textContent = (i === list.length-1) ? (DEMO.part===1 ? 'Go to AI Models \u2192' : 'Restart Demo') : 'Next Step \u2192';
  }

  function updateProgress() {
    let total = STEPS[1].length + STEPS[2].length;
    let done = 0;
    if(DEMO.login.done) done++;
    if(DEMO.wo.done) done++;
    if(DEMO.batch.done) done++;
    if(DEMO.tree.done) done++;
    if(DEMO.andon.log.length>0) done++;
    done += 4; 
    $('mainProgress').style.width = (done/total*100) + '%';
  }

  // --- 5. Views (Part 1: MES Base) ---

  function drawLogin(container) {
    const L = DEMO.login;
    let html = '';
    if (!L.done) {
      html += `
        <div style="display:flex; gap:10px; margin-bottom: 16px;">
          <button class="btn btn-ghost" data-action="fillLogin" data-u="OP-2247" data-s="Formation Cycler #4">Auto-fill: Good</button>
          <button class="btn btn-ghost" data-action="fillLogin" data-u="OP-1190" data-s="Formation Cycler #4">Auto-fill: Uncertified</button>
        </div>
        <div class="grid-row">
          <div class="field"><label>Operator ID</label><input id="lOp" value="${L.user}" class="mono"></div>
          <div class="field"><label>Station</label><select id="lSt">${STATIONS.map(s=>`<option ${s===L.station?'selected':''}>${s}</option>`).join('')}</select></div>
        </div>
        ${L.err ? `<div class="status-banner bad" style="margin-top:16px;">${getIcon('warn')} ${L.err}</div>` : ''}
        <div style="margin-top:16px;"><button class="btn btn-primary" data-action="doLogin">Authenticate Login</button></div>
      `;
    } else {
      html += `
        <div class="panel">
          <div style="font-size: 13.5px; line-height: 1.8;">
            <div style="display:flex; gap:8px;"><span style="color:var(--good)">${getIcon('check')}</span> <b>Operator Certified:</b> A. Devaraj (Level 2)</div>
            <div style="display:flex; gap:8px;"><span style="color:var(--good)">${getIcon('check')}</span> <b>Equipment Ready:</b> ${L.station} (Calibrated)</div>
          </div>
        </div>
        <div class="status-banner good" style="margin-top:16px;">${getIcon('check')} Login validated. Work order execution unlocked.</div>
      `;
    }
    container.innerHTML = html + getTalk('login');
  }

  function drawWO(container) {
    const W = DEMO.wo;
    container.innerHTML = `
      <div class="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <h3 class="mono" style="font-size:16px;">WO-88214</h3>
          <span class="chip ${W.done?'chip-good':'chip-draft'}">${W.done? 'Released' : 'Draft'}</span>
        </div>
        <div class="grid-row" style="margin-bottom:16px; font-size: 13px;">
          <div class="field"><label>Product</label><b>21700 Cylindrical Cell</b></div>
          <div class="field"><label>Target</label><b class="mono">4,000 units</b></div>
        </div>
        <button class="btn btn-ghost" data-action="toggleBOM">${W.showBom?'Hide':'Show'} Bill of Materials</button>
        ${W.showBom ? `
          <div class="table-wrap" style="margin-top:12px;">
            <table class="data-table">
              <tr><th>Component</th><th>Required</th><th>Inventory</th></tr>
              ${BOM_ITEMS.map(i=>`<tr><td>${i.item}</td><td>${i.qty}</td><td>${i.onHand}</td></tr>`).join('')}
            </table>
          </div>
        ` : ''}
      </div>
      ${!W.done 
        ? `<div style="margin-top:12px;"><button class="btn btn-primary" data-action="releaseWO">Release Order to Floor</button></div>`
        : `<div class="status-banner good">${getIcon('check')} Order released at ${W.time}. Routing locked.</div>`
      }
      ${getTalk('wo')}
    `;
  }

  function getRandVal(base, variance) { return (base + (Math.random()*2-1)*variance).toFixed(2); }
  
  function drawBatch(container) {
    const B = DEMO.batch;
    container.innerHTML = `
      <div class="panel" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <b class="mono" style="font-size:16px;">${B.id}</b>
          <div style="color:var(--ink-muted); font-size:12px; margin-top:2px;">Spec: 3.55-3.75 V | &lt; 40&deg;C</div>
        </div>
        <span class="chip ${B.done?'chip-good':'chip-draft'}">${B.done?'Batch Closed':'In Process'}</span>
      </div>
      
      ${!B.done ? `
      <div class="grid-row" style="margin-top:16px;">
        <div class="field"><label>Voltage (V)</label><input id="bv" type="number" step="0.01" value="3.65"></div>
        <div class="field"><label>Temp (&deg;C)</label><input id="bt" type="number" step="0.1" value="32.0"></div>
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn btn-navy" data-action="logManual">Log Manual</button>
        <button class="btn btn-ghost" data-action="logRandom">Auto-generate Sample</button>
      </div>` : ''}
      
      ${B.data.length > 0 ? `
      <div class="table-wrap" style="margin-top:16px;">
        <table class="data-table">
          <tr><th>Time</th><th>V</th><th>&deg;C</th><th>Status</th><th>Action</th></tr>
          ${B.data.map((r,i) => `
            <tr>
              <td>${r.t}</td><td>${r.v}</td><td>${r.temp}</td>
              <td><span class="chip ${r.ok?'chip-good':'chip-critical'}">${r.ok?'In Spec':'Out of Spec'}</span></td>
              <td>${!r.ok ? `<button class="btn btn-ghost" style="padding:4px 8px; font-size:11px; color:var(--critical); border-color:var(--critical-tint);" data-action="flagAndonBatch">Flag Andon</button>` : '-'}</td>
            </tr>
          `).join('')}
        </table>
      </div>` : ''}
      ${getTalk('batch')}
    `;
  }

  function drawTree(container) {
    const T = DEMO.tree;
    const cid = DEMO.batch.id + '-0143';
    container.innerHTML = `
      <div class="panel grid-row" style="align-items: flex-end;">
        <div class="field" style="flex:2;">
          <label>Target Cell ID</label>
          <input class="mono" value="${cid}" readonly>
        </div>
        <button class="btn btn-primary" data-action="execTrace">Execute Trace</button>
      </div>
      
      ${T.done ? `
      <div style="display:flex; gap:8px; margin-top:16px; margin-bottom:12px;">
        <button class="btn ${T.dir==='backward'?'btn-navy':'btn-ghost'}" data-action="setTreeDir" data-dir="backward">&larr; Backward</button>
        <button class="btn ${T.dir==='forward'?'btn-navy':'btn-ghost'}" data-action="setTreeDir" data-dir="forward">Forward &rarr;</button>
      </div>
      <div class="panel">
        <ul class="timeline">
          ${T.dir === 'backward' ? `
            <li class="tl-item"><div class="tl-dot">${getIcon('box')}</div><div class="tl-body"><b>Lot EL-2209</b><span>Supplier SB-7741</span></div></li>
            <li class="tl-item"><div class="tl-dot">${getIcon('grid')}</div><div class="tl-body"><b>Roll #C-118</b><span>Machine Line 1</span></div></li>
            <li class="tl-item"><div class="tl-dot">${getIcon('target')}</div><div class="tl-body"><b>Formation</b><span>${cid} indexed</span></div></li>
          ` : `
            <li class="tl-item"><div class="tl-dot">${getIcon('target')}</div><div class="tl-body"><b>Formation</b><span>${cid} Graded A</span></div></li>
            <li class="tl-item"><div class="tl-dot">${getIcon('grid')}</div><div class="tl-body"><b>Module MOD-55031</b><span>Assembled</span></div></li>
            <li class="tl-item"><div class="tl-dot">${getIcon('check')}</div><div class="tl-body"><b>Shipment</b><span>Deployed NRE-East-4</span></div></li>
          `}
        </ul>
      </div>
      ` : ''}
      ${getTalk('tree')}
    `;
  }

  function drawAndon(container) {
    const A = DEMO.andon;
    if (!A.active && !A.done) {
      container.innerHTML = `
        <div class="panel">
          <div class="grid-row" style="margin-bottom:16px;">
            ${Object.keys(ANDON_TYPES).map(k => `
              <button class="btn ${A.type===k?'btn-navy':'btn-ghost'}" style="flex:1; justify-content:center;" data-action="setAndonType" data-type="${k}">${ANDON_TYPES[k].label}</button>
            `).join('')}
          </div>
          <div style="text-align:center; padding: 20px;">
            <p style="font-size:14px; margin-bottom:12px;">Target: <b>&lt; ${ANDON_TYPES[A.type].targetMin} mins</b></p>
            <button class="btn btn-primary" style="background:var(--critical); font-size:16px;" data-action="triggerAndon">Pull Andon Cord</button>
          </div>
        </div>
        ${getTalk('andon')}
      `;
    } else {
      let elapsed = A.end ? (A.end - A.start) : (new Date() - A.start);
      container.innerHTML = `
        <div class="panel-navy panel" style="text-align:center; background: var(--critical);">
          <div style="font-size:12px; font-weight:700; text-transform:uppercase;">Live Incident: ${ANDON_TYPES[A.type].label}</div>
          <div class="big-timer" id="aTimer">${fmtMMSS(elapsed)}</div>
        </div>
        
        <div style="display:flex; gap:12px; margin: 16px 0;">
          <div class="panel" style="flex:1; text-align:center; border-color:${A.resp?'var(--good)':'var(--orange)'}">
            <h3 style="font-size:14px; margin-bottom:8px;">1. Response</h3>
            ${!A.resp ? `<button class="btn btn-primary" data-action="ackAndon">Acknowledge</button>` : `<div style="color:var(--good); font-weight:600; font-size:13px;">Ack'd</div>`}
          </div>
        </div>
        
        ${!A.done ? 
          `<div style="text-align:center;"><button class="btn btn-green" data-action="resolveAndon">Resolve Incident</button></div>` : 
          `<div class="status-banner good" style="justify-content:center;">MTTR logged. <button class="btn btn-ghost" style="margin-left:12px;" data-action="resetAndon">Reset</button></div>`
        }
      `;
    }
  }

  // --- 6. Views (Part 2: AI Enhancements) ---
  
  function drawQual(container) {
    if(DEMO.qual.items.length===0) {
      DEMO.qual.items = Array.from({length:8}, (_,i) => ({
        id: 'IMG-'+Math.floor(1000+Math.random()*9000), score: Math.floor(Math.random()*40 + 55)
      })).sort((a,b) => b.score - a.score);
    }
    let q = DEMO.qual;
    container.innerHTML = `
      <div class="panel grid-row" style="align-items:center; border-color: var(--ai-purple); background: var(--ai-purple-tint);">
        <div style="flex:1;">
          <label style="font-weight:700; font-size:11px; color:var(--ai-purple); text-transform:uppercase;">Computer Vision Confidence Threshold</label>
          <div class="slider-row" style="margin-top:8px;">
            <input type="range" min="60" max="95" value="${q.th}" id="threshSlider" style="accent-color: var(--ai-purple);">
            <span class="slider-val" style="color:var(--ai-purple);">${q.th}%</span>
          </div>
        </div>
        <button class="btn btn-purple" data-action="resampleQual">${getIcon('refresh')} Next Image Batch</button>
      </div>
      
      <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:12px; margin-top:16px;">
        ${q.items.map(u => {
          let isCrit = u.score >= q.th;
          let defect = isCrit ? ['Anomaly: Micro-short','Anomaly: Contamination','Anomaly: Burr'][Math.floor(Math.random()*3)] : 'Nominal Surface';
          return `
            <div class="ai-vision-card ${isCrit ? 'critical' : ''}" style="border-color: ${isCrit ? 'var(--critical)' : 'var(--good)'}">
              <div class="ai-vision-img">
                <div class="ai-bbox"></div>
                CAMERA_SCAN_${u.id.substring(4)}
              </div>
              <div class="ai-meta">
                <div class="score" style="color: ${isCrit ? 'var(--critical)' : 'var(--good)'}">${u.score}%</div>
                <div class="desc">${defect}</div>
                <div class="desc" style="margin-top:4px;">Action: ${isCrit ? '<b style="color:var(--critical)">AUTO-HOLD</b>' : 'PASS'}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      ${getTalk('qual')}
    `;
  }

  function drawMaint(container) {
    const M = DEMO.maint;
    const historical = [1.2, 1.3, 1.4, 1.6, 1.7, 1.9, 2.1, 2.4, 2.8, 3.2];
    
    let slope = (historical[historical.length-1] - historical[historical.length-3]) / 2;
    let remStr = "0";
    if(slope > 0 && historical[historical.length-1] < M.sens) {
      let remaining = (M.sens - historical[historical.length-1]) / slope;
      remStr = "+" + Math.floor(remaining * 1000).toLocaleString();
    }

    container.innerHTML = `
      <div class="panel grid-row" style="align-items:center; border-color: var(--ai-purple); background: var(--ai-purple-tint);">
        <div style="flex:2;">
          <label style="font-weight:700; font-size:11px; color:var(--ai-purple); text-transform:uppercase;">Failure Threshold Definition (mm/s)</label>
          <div class="slider-row" style="margin-top:8px;">
            <input type="range" min="3.5" max="6.0" step="0.1" value="${M.sens}" id="sensSlider" style="accent-color: var(--ai-purple);">
            <span class="slider-val" style="color:var(--ai-purple);">${parseFloat(M.sens).toFixed(1)}</span>
          </div>
        </div>
      </div>
      
      <div class="grid-row" style="margin-top:16px;">
        <div class="chart-container" id="maintChart" style="height:220px; flex:2;"></div>
        <div class="panel" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
          <h3 style="font-size:12px; text-transform:uppercase; color:var(--ink-secondary); margin-bottom:8px;">AI Forecasted RUL</h3>
          <div class="mono" style="font-size:32px; font-weight:700; color:var(--ai-purple);">${remStr}</div>
          <div style="font-size:11px; color:var(--ink-muted); margin-top:4px;">Cycles until threshold breach</div>
        </div>
      </div>
      ${getTalk('maint')}
    `;
    setTimeout(() => drawAiForecastChart('maintChart', historical, M.sens, false), 50);
  }

  function drawSoc(container) {
    const S = DEMO.soc;
    let manualSoc = Math.min(100, Math.max(0, S.init + (S.cur * S.time / S.cap)*100));
    let aiSoc = Math.min(100, Math.max(0, manualSoc - 1.8));
    
    container.innerHTML = `
      <div class="grid-row" style="margin-bottom:16px;">
        <button class="btn btn-ghost" data-action="setSoc" data-i="62" data-c="-40" data-t="0.25">15m Fast Discharge</button>
        <button class="btn btn-ghost" data-action="setSoc" data-i="35" data-c="20" data-t="1.0">1h Gentle Charge</button>
      </div>
      
      <div class="grid-row">
        <div class="panel" style="flex:1;">
          <h3 style="margin-bottom:12px; font-size:14px;">Live Telemetry</h3>
          <div class="field" style="margin-bottom:12px;"><label>Initial SOC (%)</label><input type="number" id="socInit" value="${S.init}"></div>
          <div class="field" style="margin-bottom:12px;"><label>Current Draw (A)</label><input type="number" id="socCur" value="${S.cur}"></div>
          <div class="field"><label>Duration (Hours)</label><input type="number" id="socTime" step="0.1" value="${S.time}"></div>
        </div>
        
        <div style="flex:1; display:flex; flex-direction:column; gap:12px;">
          <div class="panel" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
            <div style="font-size:11px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; margin-bottom:4px;">Coulomb Counting (Physics-Based)</div>
            <div class="mono" style="font-size:32px; font-weight:700;">${manualSoc.toFixed(1)}%</div>
          </div>
          <div class="panel" style="flex:1; display:flex; flex-direction:column; justify-content:center; border-color: var(--ai-purple); background: var(--ai-purple-tint);">
            <div style="font-size:11px; font-weight:700; color:var(--ai-purple); text-transform:uppercase; margin-bottom:4px;">Neural Network State Estimator</div>
            <div class="mono" style="font-size:32px; font-weight:700; color:var(--ai-purple);">${aiSoc.toFixed(1)}%</div>
            <div style="font-size:11px; color:var(--ink-secondary); margin-top:4px;">Model identifies <b style="color:var(--critical)">1.8% capacity fade</b> hidden by resistance drift.</div>
          </div>
        </div>
      </div>
      ${getTalk('soc')}
    `;
  }

  function drawTwin(container) {
    const T = DEMO.twin;
    container.innerHTML = `
      <div class="panel grid-row" style="align-items:center; border-color: var(--ai-purple); background: var(--ai-purple-tint);">
        <div style="flex:1;">
          <label style="font-weight:700; font-size:11px; color:var(--ai-purple); text-transform:uppercase;">Neural Net Simulator: C-Rate Injection</label>
          <div class="slider-row" style="margin-top:8px;">
            <input type="range" min="0.5" max="3.0" step="0.1" value="${T.crate}" id="crateSlider" style="accent-color: var(--ai-purple);">
            <span class="slider-val" style="color:var(--ai-purple);">${parseFloat(T.crate).toFixed(1)}C</span>
          </div>
        </div>
      </div>
      <div class="chart-container" id="twinChart" style="height:240px; margin: 16px 0;"></div>
      ${getTalk('twin')}
    `;
    
    let base = 100;
    let data = [base];
    let degFactor = 0.5 + (parseFloat(T.crate) * 0.8);
    for(let i=1; i<=10; i++) { base -= degFactor; data.push(Math.max(0, base)); }
    drawAiForecastChart('twinChart', data, 70, true);
  }

  function drawAiForecastChart(id, data, threshold, isDegradation = false) {
    const el = document.getElementById(id);
    if(!el) return;
    
    const w = el.clientWidth > 0 ? el.clientWidth - 40 : 800; 
    const h = el.clientHeight > 0 ? el.clientHeight - 40 : 200;
    
    let historical = isDegradation ? [100] : data;
    let forecast = [];
    
    if(!isDegradation) {
      let slope = (data[data.length-1] - data[data.length-3]) / 2;
      let lastVal = data[data.length-1];
      forecast.push(lastVal);
      for(let i=1; i<=4; i++) { forecast.push(lastVal + (slope * i)); }
    } else {
      forecast = data; 
      historical = [data[0]]; 
    }

    const fullData = [...historical.slice(0,-1), ...forecast];
    const maxVal = isDegradation ? 100 : Math.max(...fullData, threshold) * 1.2;
    const minVal = isDegradation ? 50 : 0;
    
    const getX = (i) => (i / Math.max(1, fullData.length-1)) * w;
    const getY = (val) => h - ((val - minVal) / (maxVal - minVal)) * h;

    let histPts = historical.map((v, i) => `${getX(i)},${getY(v)}`).join(' L ');
    let offset = historical.length - 1;
    let forePts = forecast.map((v, i) => `${getX(i + offset)},${getY(v)}`).join(' L ');
    
    let confPoly = '';
    if(forecast.length > 1) {
      let upper = forecast.map((v, i) => `${getX(i + offset)},${getY(v + (isDegradation?4:-0.4)*(i/forecast.length))}`);
      let lower = forecast.map((v, i) => `${getX(i + offset)},${getY(v - (isDegradation?4:-0.4)*(i/forecast.length))}`).reverse();
      confPoly = `M ${upper.join(' L ')} L ${lower.join(' L ')} Z`;
    }

    let thY = getY(threshold);
    
    el.innerHTML = `
      <svg width="100%" height="100%" style="overflow:visible;">
        <g transform="translate(20, 20)">
          <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--chart-axis)" stroke-width="2"/>
          <line x1="0" y1="0" x2="0" y2="${h}" stroke="var(--chart-axis)" stroke-width="2"/>
          
          <line x1="0" y1="${thY}" x2="${w}" y2="${thY}" stroke="var(--critical)" stroke-width="2" stroke-dasharray="4,4"/>
          <text x="${w+10}" y="${thY+5}" fill="var(--critical)" font-size="12" font-weight="600" font-family="IBM Plex Mono">${parseFloat(threshold).toFixed(1)}</text>
          
          ${confPoly ? `<path d="${confPoly}" fill="var(--ai-purple)" opacity="0.15" />` : ''}
          ${forePts ? `<path d="M ${forePts}" fill="none" stroke="var(--ai-purple)" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>` : ''}
          ${histPts && historical.length > 1 ? `<path d="M ${histPts}" fill="none" stroke="var(--series-1)" stroke-width="3" stroke-linecap="round"/>` : ''}
          
          ${historical.map((v, i) => `<circle cx="${getX(i)}" cy="${getY(v)}" r="4" fill="var(--surface)" stroke="var(--series-1)" stroke-width="2"/>`).join('')}
          ${forecast.slice(1).map((v, i) => `<circle cx="${getX(i+offset+1)}" cy="${getY(v)}" r="4" fill="var(--surface)" stroke="var(--ai-purple)" stroke-width="2"/>`).join('')}
        </g>
      </svg>
    `;
  }

  // --- 7. Event Listeners ---
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    
    if (action === 'setPart') { DEMO.part = parseInt(target.dataset.part); render(); }
    else if (action === 'setStep') { DEMO.idx[DEMO.part] = parseInt(target.dataset.step); render(); }
    else if (action === 'prevStep') {
      let i = DEMO.idx[DEMO.part];
      if(i > 0) { DEMO.idx[DEMO.part]--; render(); }
      else if(DEMO.part === 2) { DEMO.part = 1; DEMO.idx[1] = STEPS[1].length-1; render(); }
    }
    else if (action === 'nextStep') {
      let i = DEMO.idx[DEMO.part], len = STEPS[DEMO.part].length;
      if(i < len-1) { DEMO.idx[DEMO.part]++; render(); }
      else if(DEMO.part === 1) { DEMO.part = 2; DEMO.idx[2] = 0; render(); }
      else { $('btnReset').click(); }
    }
    else if (action === 'toggleTheme') { 
      DEMO.theme = DEMO.theme === 'system' ? 'light' : (DEMO.theme === 'light' ? 'dark' : 'system'); 
      const root = document.documentElement;
      if(DEMO.theme === 'light') root.setAttribute('data-theme', 'light');
      else if(DEMO.theme === 'dark') root.setAttribute('data-theme', 'dark');
      else root.removeAttribute('data-theme');
      let ico = DEMO.theme === 'light' ? 'sun' : (DEMO.theme === 'dark' ? 'moon' : 'monitor');
      $('btnTheme').innerHTML = getIcon(ico);
      try { localStorage.setItem('ctb-theme', DEMO.theme); } catch(err){}
      render(); 
    }
    else if (action === 'toggleFull') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    }
    else if (action === 'toggleHelp') { $('helpModal').hidden = !$('helpModal').hidden; }
    else if (action === 'resetDemo') {
      clearAllIntervals();
      Object.assign(DEMO, {
        part: 1, idx: {1:0, 2:0},
        login: { done: false, user: 'OP-2247', station: 'Formation Cycler #4', err: '', time: null },
        wo: { done: false, showBom: false, time: null },
        batch: { id: 'B-'+Math.floor(10000+Math.random()*90000), done: false, data: [] },
        tree: { done: false, id: null, dir: 'backward' },
        andon: { active: false, done: false, type: 'quality', start: null, resp: null, esc: null, end: null, log: [], timer: null },
        qual: { th: 80, items: [] }, maint: { sens: 4.0, mac: 'form4' },
        soc: { init: 62, cur: -15, time: 0.25, cap: 75 }, twin: { crate: 1.0 }
      });
      render();
    }
    else if (action === 'fillLogin') { DEMO.login.user = target.dataset.u; DEMO.login.station = target.dataset.s; DEMO.login.err=''; render(); }
    else if (action === 'doLogin') {
      let u = $('lOp').value, s = $('lSt').value;
      if(u !== 'OP-2247') { DEMO.login.err = "Access Denied: Operator not certified."; DEMO.login.user=u; }
      else if(s === 'Winding Cell 6') { DEMO.login.err = "Access Denied: Station down for PM."; DEMO.login.station=s; }
      else { DEMO.login.done = true; DEMO.login.time = new Date().toLocaleTimeString(); DEMO.login.err = ''; }
      render();
    }
    else if (action === 'toggleBOM') { DEMO.wo.showBom = !DEMO.wo.showBom; render(); }
    else if (action === 'releaseWO') { DEMO.wo.done = true; DEMO.wo.time = new Date().toLocaleTimeString(); render(); }
    else if (action === 'logManual') {
      let v = $('bv').value, t = $('bt').value;
      let ok = (v >= 3.55 && v <= 3.75 && t < 40);
      DEMO.batch.data.push({t: new Date().toLocaleTimeString(), v: v, temp: t, ok: ok});
      render();
    }
    else if (action === 'logRandom') {
      let v = (3.65 + (Math.random()*2-1)*0.2).toFixed(2);
      let t = (35 + (Math.random()*2-1)*8).toFixed(2);
      let ok = (v >= 3.55 && v <= 3.75 && t < 40);
      DEMO.batch.data.push({t: new Date().toLocaleTimeString(), v: v, temp: t, ok: ok});
      render();
    }
    else if (action === 'flagAndonBatch') { 
      DEMO.andon.type = 'quality'; DEMO.part = 1; DEMO.idx[1] = 4;
      DEMO.andon.active = true; DEMO.andon.done = false; DEMO.andon.start = new Date();
      DEMO.andon.resp = null; DEMO.andon.end = null;
      clearAllIntervals();
      DEMO.andon.timer = setInterval(() => { if($('aTimer') && !DEMO.andon.done) $('aTimer').textContent = fmtMMSS(new Date() - DEMO.andon.start); }, 1000);
      render();
    }
    else if (action === 'execTrace') { DEMO.tree.done = true; render(); }
    else if (action === 'setTreeDir') { DEMO.tree.dir = target.dataset.dir; render(); }
    else if (action === 'setAndonType') { DEMO.andon.type = target.dataset.type; render(); }
    else if (action === 'triggerAndon') {
      DEMO.andon.active = true; DEMO.andon.done = false; DEMO.andon.start = new Date();
      DEMO.andon.resp = null; DEMO.andon.end = null;
      clearAllIntervals();
      DEMO.andon.timer = setInterval(() => { if($('aTimer') && !DEMO.andon.done) $('aTimer').textContent = fmtMMSS(new Date() - DEMO.andon.start); }, 1000);
      render();
    }
    else if (action === 'ackAndon') { DEMO.andon.resp = new Date(); render(); }
    else if (action === 'resolveAndon') {
      DEMO.andon.end = new Date(); DEMO.andon.done = true; clearAllIntervals();
      let t = ANDON_TYPES[DEMO.andon.type];
      let mttr = DEMO.andon.end - DEMO.andon.start;
      DEMO.andon.log.unshift({ type: t.label, start: DEMO.andon.start, mttr: mttr, pass: (mttr <= t.targetMin*60000) });
      render();
    }
    else if (action === 'resetAndon') { DEMO.andon.active = false; DEMO.andon.done = false; render(); }
    else if (action === 'resampleQual') {
      DEMO.qual.items = Array.from({length:8}, (_,i) => ({
        id: 'IMG-'+Math.floor(1000+Math.random()*9000), score: Math.floor(Math.random()*40 + 55)
      })).sort((a,b) => b.score - a.score);
      render();
    }
    else if (action === 'setSoc') { DEMO.soc.init = parseFloat(target.dataset.i); DEMO.soc.cur = parseFloat(target.dataset.c); DEMO.soc.time = parseFloat(target.dataset.t); render(); }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'lOp') DEMO.login.user = el.value;
    else if (el.id === 'lSt') DEMO.login.station = el.value;
    else if (el.id === 'threshSlider') { DEMO.qual.th = el.value; render(); }
    else if (el.id === 'sensSlider') { DEMO.maint.sens = el.value; render(); }
    else if (el.id === 'socInit') { DEMO.soc.init = parseFloat(el.value); render(); }
    else if (el.id === 'socCur') { DEMO.soc.cur = parseFloat(el.value); render(); }
    else if (el.id === 'socTime') { DEMO.soc.time = parseFloat(el.value); render(); }
    else if (el.id === 'crateSlider') { DEMO.twin.crate = el.value; render(); }
  });

  document.addEventListener('keydown', e => {
    if(['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if(e.key === 'Escape') { $('helpModal').hidden = true; }
    if(e.key === 'ArrowRight') { let btn = $('btnNext'); if(btn) btn.click(); }
    if(e.key === 'ArrowLeft') { let btn = $('btnPrev'); if(btn && !btn.disabled) btn.click(); }
  });

  // --- Boot ---
  try { const t = localStorage.getItem('ctb-theme'); if(t) { DEMO.theme = t; } } catch(e){}
  const root = document.documentElement;
  if(DEMO.theme === 'light') root.setAttribute('data-theme', 'light');
  else if(DEMO.theme === 'dark') root.setAttribute('data-theme', 'dark');
  let ico = DEMO.theme === 'light' ? 'sun' : (DEMO.theme === 'dark' ? 'moon' : 'monitor');
  
  $('headerLogo').innerHTML = getIcon('lightning');
  $('btnHelp').innerHTML = getIcon('info');
  $('btnTheme').innerHTML = getIcon(ico);
  $('btnFull').innerHTML = getIcon('fullscreen');
  
  render();

})();
</script>
</body>
</html>
